; Live plane radar for the ELEGOO CYD 2.8" ESP32-32E (E32R28T)
;
; Board pins match ../cyd-touch-demo (see its README for where they come from).
; Before building: copy include/config.example.h to include/config.h and fill it in.

[platformio]
default_envs = e32r28t

[env:e32r28t]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    ; The registry copy is a 2019 snapshot without begin(SPIClass&); use the v1.4 tag
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@7.4.3

build_flags =
    ; ---- TFT_eSPI (same as cyd-touch-demo) ----
    -D USER_SETUP_LOADED=1
    ; E32R28T-1 boards use ST7789: swap for -D ST7789_DRIVER=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_SCLK=14
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; -D TFT_INVERSION_ON=1

    ; ---- XPT2046 touch on its own bus (same as cyd-touch-demo) ----
    -D CYD_TOUCH_SCLK=25
    -D CYD_TOUCH_MOSI=32
    -D CYD_TOUCH_MISO=39
    -D CYD_TOUCH_CS=33
    -D CYD_TOUCH_IRQ=36
    -D CYD_ROTATION=1
