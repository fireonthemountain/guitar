; ELEGOO CYD 2.8" ESP32-32E (E32R28T) touchscreen demo
;
; Every board pin lives in this file. The values come from the vendor's
; E32R28T documentation, NOT from the generic ESP32-2432S028R "CYD" pinout.
; See README.md, "Verify the pinout", before trusting them on your unit.

[platformio]
default_envs = e32r28t

[env:e32r28t]
; espressif32 6.x = Arduino-ESP32 core 2.0.x, which TFT_eSPI supports.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    paulstoffregen/XPT2046_Touchscreen@1.4

build_flags =
    ; ---- TFT_eSPI: configure from here instead of editing User_Setup.h ----
    -D USER_SETUP_LOADED=1
    ; Original E32R28T = ILI9341. The newer E32R28T-1 revision uses ST7789:
    ; if colours/image are garbage, swap the next line for -D ST7789_DRIVER=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; Display SPI bus (ESP32 HSPI)
    -D USE_HSPI_PORT=1
    -D TFT_SCLK=14
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_CS=15
    -D TFT_DC=2
    ; LCD reset is wired to the ESP32 EN (reset) line, not a GPIO
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; Uncomment if black and white come out swapped:
    ; -D TFT_INVERSION_ON=1

    ; ---- XPT2046 resistive touch: its own SPI bus (ESP32 VSPI, remapped) ----
    -D CYD_TOUCH_SCLK=25
    -D CYD_TOUCH_MOSI=32
    -D CYD_TOUCH_MISO=39
    -D CYD_TOUCH_CS=33
    -D CYD_TOUCH_IRQ=36

    ; Screen rotation shared by display and touch (1 = landscape, USB on the right)
    -D CYD_ROTATION=1
