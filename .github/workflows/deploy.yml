name: Deploy guitar-jam to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: guitar-jam/package-lock.json

      - name: Install
        working-directory: guitar-jam
        run: npm ci

      - name: Build (served at /guitar/)
        working-directory: guitar-jam
        env:
          BASE_PATH: /guitar/
        run: npm run build

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: guitar-jam/dist

      - id: deployment
        uses: actions/deploy-pages@v4
