name: Deploy guitar-jam to GitHub Pages

# Publishes the built app to the gh-pages branch — GitHub serves it at
# https://<owner>.github.io/guitar/. (The branch route avoids needing the
# Pages API, which the workflow token can't call on this repo.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: guitar-jam/package-lock.json

      - name: Install
        working-directory: guitar-jam
        run: npm ci

      - name: Build (served at /guitar/)
        working-directory: guitar-jam
        env:
          BASE_PATH: /guitar/
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: guitar-jam/dist
